name: Derleme

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  derle-ve-test-et:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Bağımlılıklar
        run: dotnet restore

      - name: Derleme (uyarılar hata sayılır)
        run: dotnet build --configuration Release --no-restore

      - name: Testler
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=sonuclar.trx"

      - name: Test sonuçları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-sonuclari
          path: tests/**/TestResults/*.trx
